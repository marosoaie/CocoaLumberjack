name: Steward

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  steward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Dangerfile's SwiftLint rule reads this report, and keeps the
      # violations on the lines the pull request changes. Exit status 2 is
      # SwiftLint finding errors, which the rule reports; anything else
      # non-zero is SwiftLint failing to run.
      - name: SwiftLint
        run: |
          code=0
          docker run --rm -v "$PWD:$PWD" -w "$PWD" ghcr.io/realm/swiftlint:0.65.1 \
            lint --quiet Sources > swiftlint.log || code=$?
          cat swiftlint.log
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
      # No v1 tag yet: pinned to a commit of the Action's main branch.
      - uses: marosoaie/steward-action@c606a4a637221b3d86c35e18c71aa4bbf6d9fecb
        if: ${{ !cancelled() }}
